<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E.D</title>
<style>
:root{--amber:#ffb000;--dim:#8a6a1f;--ink:#ffd27a;--panel:#140f04;--line:#5a4010}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:radial-gradient(ellipse at 50% 25%,#1d1405,#07050a 70%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:auto;padding:12px}
canvas{width:100%;height:36vh;min-height:190px;flex:none}
#status{text-align:center;font-size:14px;color:var(--amber);min-height:20px}
#log{flex:1;overflow-y:auto;padding:8px 4px;display:flex;flex-direction:column;gap:8px}
.m{padding:8px 12px;border-radius:10px;max-width:88%;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.u{align-self:flex-end;background:#2a1d05;border:1px solid var(--line)}
.a{align-self:flex-start;background:var(--panel);border:1px solid var(--amber);box-shadow:0 0 14px #ffb00030}
.s{align-self:center;font-size:13px;color:var(--dim);text-align:center}
form{display:flex;gap:8px;padding-top:8px}
input,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
input{flex:1;min-width:0}
button{cursor:pointer}
button:hover,input:focus-visible,button:focus-visible{border-color:var(--amber);outline:none}
#mic.on{background:var(--amber);color:#000}
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--amber);border-radius:12px;width:min(420px,92%)}
dialog label{display:block;margin:12px 0 4px;font-size:14px}
dialog input{width:100%}
dialog p{font-size:13px;color:var(--dim);line-height:1.4}
</style>
</head>
<body>
<div id="app">
  <canvas id="sphere"></canvas>
  <div id="status">Micrófono apagado</div>
  <div id="log"></div>
  <form>
    <button type="button" id="mic" title="Activar escucha: di «ev»">Micrófono</button>
    <input id="txt" placeholder="Escribe a E.D…" autocomplete="off">
    <button type="submit">Enviar</button>
    <button type="button" id="cfg" title="Ajustes">Ajustes</button>
  </form>
</div>

<dialog id="dlg">
  <h3 style="margin:0">Ajustes</h3>
  <label for="key">Clave API de Google (Gemini)</label>
  <input id="key" type="password" autocomplete="off" placeholder="Pega tu clave aquí">
  <label for="model">Modelo</label>
  <input id="model" placeholder="gemini-2.5-flash">
  <label for="elkey">Clave API de ElevenLabs (voz)</label>
  <input id="elkey" type="password" autocomplete="off" placeholder="Pega tu clave de ElevenLabs">
  <label for="elvoice">ID de la voz de ElevenLabs</label>
  <input id="elvoice" placeholder="EXAVITQu4vr4xnSDxMaL (Sarah)">
  <p>Las claves se guardan solo en este navegador. No las escribas en el código ni las subas a GitHub. Sin clave de ElevenLabs, E.D usa la voz del navegador.</p>
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button type="button" id="cancel">Cerrar</button>
    <button type="button" id="save">Guardar</button>
  </div>
</dialog>

<script>
const $=s=>document.querySelector(s);
const log=$('#log'),statusEl=$('#status');
const store={get:k=>{try{return localStorage.getItem(k)||''}catch{return ''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
let state='idle';
function setState(s,t){state=s;statusEl.textContent=t||({idle:'En espera. Di «ev»',listening:'Te escucho',thinking:'Pensando',speaking:'Hablando'}[s])}
function add(cls,t){const d=document.createElement('div');d.className='m '+cls;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight}

/* Esfera holográfica ámbar */
const cv=$('#sphere'),cx=cv.getContext('2d');
const pts=[];for(let i=0;i<420;i++){const y=1-2*(i+.5)/420,r=Math.sqrt(1-y*y),a=i*2.39996;pts.push([Math.cos(a)*r,y,Math.sin(a)*r])}
let t=0;
function draw(){
  const d=devicePixelRatio||1,w=cv.width=cv.clientWidth*d,h=cv.height=cv.clientHeight*d;
  t+=.008;
  const en={idle:.03,listening:.1,thinking:.18,speaking:.14}[state];
  const mod=state==='speaking'?1+Math.sin(t*17)*.6:1;
  const R=Math.min(w,h)*.34*(1+Math.sin(t*6)*en*mod);
  cx.save();cx.translate(w/2,h/2);
  const g=cx.createRadialGradient(0,0,R*.2,0,0,R*1.7);
  g.addColorStop(0,'rgba(255,176,0,.18)');g.addColorStop(1,'rgba(255,176,0,0)');
  cx.fillStyle=g;cx.fillRect(-w/2,-h/2,w,h);
  const cs=Math.cos(t),sn=Math.sin(t),ct=Math.cos(.4),st=Math.sin(.4);
  for(const [x,y,z] of pts){
    const x1=x*cs+z*sn,z1=-x*sn+z*cs,y2=y*ct-z1*st,z2=y*st+z1*ct,k=(z2+1)/2;
    cx.fillStyle=`rgba(255,${150+k*80|0},${k*60|0},${.15+k*.85})`;
    cx.beginPath();cx.arc(x1*R,y2*R,(1+k*1.6)*d,0,7);cx.fill();
  }
  cx.strokeStyle='rgba(255,176,0,.5)';cx.lineWidth=d;
  cx.beginPath();cx.arc(0,0,R*1.18,0,7);cx.stroke();
  cx.setLineDash([6*d,10*d]);cx.beginPath();cx.arc(0,0,R*1.3,t,t+6.28);cx.stroke();
  cx.restore();requestAnimationFrame(draw);
}
draw();

/* Voz de chica */
let voice=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('es'));
  const fem=/paulina|monica|mónica|helena|sabina|laura|lucia|lucía|elvira|dalia|female|google español/i;
  voice=vs.find(v=>fem.test(v.name))||vs[0]||null;
}
speechSynthesis.onvoiceschanged=pickVoice;pickVoice();
function speakBrowser(clean){
  return new Promise(res=>{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(clean);
    if(voice)u.voice=voice;
    u.lang=voice?voice.lang:'es-ES';u.pitch=1.15;u.rate=1.02;
    u.onend=u.onerror=()=>res();
    setState('speaking');speechSynthesis.speak(u);
  });
}
async function speakEleven(clean){
  const k=store.get('elkey');if(!k)return false;
  const vid=store.get('elvoice')||'EXAVITQu4vr4xnSDxMaL';
  const r=await fetch('https://api.elevenlabs.io/v1/text-to-speech/'+encodeURIComponent(vid),{
    method:'POST',headers:{'Content-Type':'application/json','xi-api-key':k,'Accept':'audio/mpeg'},
    body:JSON.stringify({text:clean,model_id:'eleven_multilingual_v2'})});
  if(!r.ok){let m=r.status;try{const d=await r.json();m=d.detail?.message||d.detail?.status||m}catch{}throw new Error('ElevenLabs: '+m)}
  const url=URL.createObjectURL(await r.blob());
  return new Promise(res=>{
    const a=new Audio(url);
    a.onended=()=>{URL.revokeObjectURL(url);res(true)};
    a.onerror=()=>{URL.revokeObjectURL(url);res(false)};
    setState('speaking');a.play().catch(()=>res(false));
  });
}
async function speak(text){
  const clean=text.replace(/[*_`#>]/g,'').replace(/https?:\/\/\S+/g,'enlace');
  try{if(await speakEleven(clean))return}
  catch(e){add('s',e.message+'. Uso la voz del navegador.')}
  return speakBrowser(clean);
}

/* Herramientas del agente */
const TOOLS=[{functionDeclarations:[
  {name:'abrir_web',description:'Abre una página web en una pestaña nueva',parameters:{type:'OBJECT',properties:{url:{type:'STRING'}},required:['url']}},
  {name:'buscar_google',description:'Busca algo en Google en una pestaña nueva',parameters:{type:'OBJECT',properties:{consulta:{type:'STRING'}},required:['consulta']}},
  {name:'buscar_youtube',description:'Busca algo en YouTube en una pestaña nueva',parameters:{type:'OBJECT',properties:{consulta:{type:'STRING'}},required:['consulta']}},
  {name:'fecha_hora',description:'Devuelve la fecha y la hora actuales'}
]}];
function openTab(u){const w=window.open(u,'_blank');return w?'abierto':'bloqueado: hay que permitir ventanas emergentes para este sitio'}
function runTool(n,a){
  if(n==='abrir_web'){let u=a.url||'';if(!/^https?:\/\//i.test(u))u='https://'+u;return openTab(u)}
  if(n==='buscar_google')return openTab('https://www.google.com/search?q='+encodeURIComponent(a.consulta||''));
  if(n==='buscar_youtube')return openTab('https://www.youtube.com/results?search_query='+encodeURIComponent(a.consulta||''));
  if(n==='fecha_hora')return new Date().toLocaleString('es-ES',{dateStyle:'full',timeStyle:'short'});
  return 'herramienta desconocida';
}

/* Cerebro: API de Google (Gemini) */
const hist=[];
async function ask(text,spoken){
  const key=store.get('key');
  if(!key)throw new Error('Falta la clave API de Google. Abre Ajustes y pégala.');
  const model=store.get('model')||'gemini-2.5-flash';
  const sys='Eres E.D (se pronuncia "ev"), un asistente de IA estilo Jarvis con voz femenina. Hablas español, cercana y segura. Eres un agente: usa tus herramientas para abrir webs y buscar cuando te lo pidan. '
    +(spoken?'Te hablan por voz: responde en 1 a 3 frases cortas, sin listas ni markdown.':'Te escriben: puedes responder con más detalle.')
    +' Si una herramienta dice que fue bloqueada, explica que hay que permitir ventanas emergentes. Sé honesta: no puedes controlar el sistema operativo, solo abrir pestañas y buscar.';
  const contents=[...hist,{role:'user',parts:[{text}]}];
  for(let i=0;i<4;i++){
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{
      method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},
      body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents,tools:TOOLS})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error?.message||r.status);
    const parts=d.candidates?.[0]?.content?.parts||[];
    const calls=parts.filter(p=>p.functionCall);
    if(!calls.length){
      const out=parts.map(p=>p.text||'').join('').trim()||'(sin respuesta)';
      hist.push({role:'user',parts:[{text}]},{role:'model',parts:[{text:out}]});
      if(hist.length>16)hist.splice(0,2);
      return out;
    }
    contents.push({role:'model',parts});
    contents.push({role:'user',parts:calls.map(p=>{
      const res=runTool(p.functionCall.name,p.functionCall.args||{});
      add('s','Acción: '+p.functionCall.name+' · '+res);
      return {functionResponse:{name:p.functionCall.name,response:{resultado:res}}};
    })});
  }
  return 'Hice demasiadas acciones seguidas. Dime qué falta.';
}

let busy=false;
async function handle(text,spoken){
  if(busy)return;busy=true;
  add('u',text);setState('thinking');
  try{const reply=await ask(text,spoken);add('a',reply);if(spoken)await speak(reply)}
  catch(e){add('s','Error: '+e.message)}
  setTimeout(()=>{busy=false;setState('idle',wantMic?undefined:'Micrófono apagado')},500);
}

/* Escucha con palabra de activación */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,wantMic=false,awake=false,awakeTimer=null;
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[.,;:!?¿¡]/g,' ').replace(/\s+/g,' ').trim();
const WAKE=/\b(?:(?:oye|ey|hey|hola)\s+)?(?:ev|eve|ed|e d|e de|ede|eb)\b\s*(.*)$/;
function startRec(){
  if(!SR){add('s','Este navegador no tiene reconocimiento de voz. Usa Chrome.');return}
  rec=new SR();rec.lang='es-ES';rec.continuous=true;rec.interimResults=false;
  rec.onresult=e=>{
    if(busy)return;
    const n=norm(e.results[e.results.length-1][0].transcript);
    const m=n.match(WAKE);
    let cmd=m?m[1]:(awake?n:null);
    if(cmd===null)return;
    if(cmd.length<2){
      awake=true;setState('listening');clearTimeout(awakeTimer);
      awakeTimer=setTimeout(()=>{awake=false;if(!busy)setState('idle')},8000);return;
    }
    awake=false;clearTimeout(awakeTimer);handle(cmd,true);
  };
  rec.onend=()=>{if(wantMic)setTimeout(()=>{try{rec.start()}catch{}},300)};
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      wantMic=false;$('#mic').classList.remove('on');setState('idle','Micrófono apagado');
      add('s','Permiso de micrófono denegado. Actívalo en el candado de la barra de direcciones.');
    }
  };
  try{rec.start()}catch{}
}
$('#mic').onclick=()=>{
  wantMic=!wantMic;$('#mic').classList.toggle('on',wantMic);
  if(wantMic){startRec();setState('idle')}
  else{try{rec.stop()}catch{};setState('idle','Micrófono apagado')}
};

/* Chat escrito y ajustes */
$('form').onsubmit=e=>{e.preventDefault();const i=$('#txt'),v=i.value.trim();if(v){i.value='';handle(v,false)}};
$('#cfg').onclick=()=>{$('#key').value=store.get('key');$('#model').value=store.get('model');$('#elkey').value=store.get('elkey');$('#elvoice').value=store.get('elvoice');$('#dlg').showModal()};
$('#cancel').onclick=()=>$('#dlg').close();
$('#save').onclick=()=>{store.set('key',$('#key').value.trim());store.set('model',$('#model').value.trim());store.set('elkey',$('#elkey').value.trim());store.set('elvoice',$('#elvoice').value.trim());$('#dlg').close();add('s','Ajustes guardados.')};
add('s','Abre Ajustes y pega tu clave de Google. Luego pulsa Micrófono y di «ev» seguido de lo que quieras.');
if(!store.get('key'))$('#dlg').showModal&&setTimeout(()=>$('#cfg').click(),400);
</script>
</body>
</html>
